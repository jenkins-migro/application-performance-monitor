name: Gradle SonarQube Docker

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: my-app
  REGISTRY: registry.example.com
  SONAR_PROJECT_KEY: my-project
  SONAR_PROJECT_NAME: My Project
  REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

jobs:
  build-test-analyze-package:
    name: Build, test, analyze, package
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Prepare Gradle wrapper
        if: ${{ hashFiles('gradlew') != '' }}
        run: chmod +x ./gradlew

      - name: Build
        if: ${{ hashFiles('gradlew') != '' }}
        run: ./gradlew clean build

      - name: Test
        if: ${{ hashFiles('gradlew') != '' }}
        run: ./gradlew test

      - name: Upload test results
        if: ${{ always() && hashFiles('build/test-results/test/*.xml') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gradle-test-results
          path: build/test-results/test/*.xml

      - name: SonarQube analysis
        if: ${{ hashFiles('gradlew') != '' && env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: >-
          ./gradlew sonarqube
          -Dsonar.projectKey="${SONAR_PROJECT_KEY}"
          -Dsonar.projectName="${SONAR_PROJECT_NAME}"
          -Dsonar.projectVersion="${BUILD_NUMBER}"
          -Dsonar.sources=src/main
          -Dsonar.tests=src/test
          -Dsonar.java.binaries=build/classes
          -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

      - name: Quality gate
        if: ${{ hashFiles('gradlew') != '' && env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        run: |
          deadline=$((SECONDS + 600))
          status="PENDING"
          while [ "$SECONDS" -lt "$deadline" ]; do
            response=$(curl -fsS -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}")
            status=$(python -c 'import json,sys; print(json.load(sys.stdin)["projectStatus"]["status"])' <<<"$response")
            if [ "$status" != "PENDING" ] && [ "$status" != "IN_PROGRESS" ]; then
              break
            fi
            sleep 15
          done
          if [ "$status" != "OK" ]; then
            echo "Pipeline aborted due to quality gate failure: $status" >&2
            exit 1
          fi

      - name: Package
        if: ${{ hashFiles('gradlew') != '' }}
        run: ./gradlew bootJar

      - name: Upload JAR artifact
        if: ${{ hashFiles('build/libs/*.jar') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: application-jar
          path: build/libs/*.jar

      - name: Docker build and push
        if: >-
          ${{ hashFiles('Dockerfile') != '' &&
              (github.ref_name == 'main' || github.ref_name == 'master') &&
              env.REGISTRY_USERNAME != '' && env.REGISTRY_PASSWORD != '' }}
        run: |
          echo "${REGISTRY_PASSWORD}" | docker login "${REGISTRY}" --username "${REGISTRY_USERNAME}" --password-stdin
          docker build -t "${REGISTRY}/${IMAGE_NAME}:${{ github.run_number }}" -t "${REGISTRY}/${IMAGE_NAME}:latest" .
          docker push "${REGISTRY}/${IMAGE_NAME}:${{ github.run_number }}"
          docker push "${REGISTRY}/${IMAGE_NAME}:latest"
